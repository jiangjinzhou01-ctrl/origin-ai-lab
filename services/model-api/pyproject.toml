[project]
name = "origin-model-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.10.0",
  "transformer-lens==4.3.0",
  "transformers==5.22.1",
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "numpy>=2.2,<3",
  "uvicorn>=0.34,<1",
  "jsonschema>=4.23,<5",
  "psutil>=6,<8",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: actual GPT-2 model integration"]
[tool.ruff]
line-length = 100
