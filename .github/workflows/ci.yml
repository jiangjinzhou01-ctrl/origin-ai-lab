name: Verify ORIGIN
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
      - run: npm ci
      - run: uv sync --frozen
        working-directory: services/model-api
      - run: PYTHONPATH=. uv run python scripts/export_schema.py
        working-directory: services/model-api
      - run: npm run schema:types && git diff --exit-code schemas apps/web/src/data/analysis.generated.ts
      - run: npm run check && npm run lint && npm test && npm run build
      - run: uv run ruff check app tests scripts && uv run ruff format --check app tests scripts && uv run pytest -m 'not integration' -q
        working-directory: services/model-api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: apps/web/test-results
